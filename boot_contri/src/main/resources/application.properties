# FirstDiff backend configuration
server.port=8080

# Java 21 virtual threads - makes parallel GitHub fan-out cheap
spring.threads.virtual.enabled=true

# GitHub token comes from the GH_TOKEN environment variable (see README)
# Never hardcode it here.

# CORS: comma-separated list of allowed frontend origins
firstdiff.cors.origins=http://localhost:5173,http://localhost:3000

# Cache TTLs (minutes)
firstdiff.cache.search-ttl-minutes=30
firstdiff.cache.health-ttl-minutes=180
